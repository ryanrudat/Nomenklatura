// ── ios-frame.js ──

// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports: IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
        {/* trailing ellipsis */}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>
          </svg>
        )}
      </div>
      {/* large title */}
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4,
      }}>{title}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({
  children, width = 402, height = 874, dark = false,
  title, keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar (absolute) */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      {/* nav + content */}
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
        {title !== undefined && <IOSNavBar title={title} dark={dark} />}
        <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>
        {keyboard && <IOSKeyboard dark={dark} />}
      </div>
      {/* home indicator — always on top */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none',
      }}>
        <div style={{
          width: 139, height: 5, borderRadius: 100,
          background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
        }} />
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,
});

// ─── Stat meter: animated bar ───
function StatMeter({ label, icon, value, delta, theme, showDelta }) {
  const [display, setDisplay] = useState(value - (delta || 0));
  useEffect(() => {
    if (!showDelta) { setDisplay(value); return; }
    const start = display;
    const end = value;
    const t0 = performance.now();
    const dur = 900;
    let raf;
    const step = (t) => {
      const p = Math.min(1, (t - t0) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      setDisplay(Math.round(start + (end - start) * eased));
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [value, showDelta]);

  const pct = Math.max(0, Math.min(100, display));
  const deltaVisible = showDelta && delta && delta !== 0;

  return (
    <div style={{ marginBottom: 10 }}>
      <div style={{
        display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: 8,
        fontFamily: theme.mono, fontSize: 9.5,
        color: theme.inkSoft, letterSpacing: 1,
        textTransform: 'uppercase', marginBottom: 6, whiteSpace: 'nowrap',
      }}>
        <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', minWidth: 0 }}>{icon} {label}</span>
        <span style={{ color: theme.ink, fontWeight: 600 }}>
          {display}
          {deltaVisible && (
            <span style={{
              marginLeft: 6,
              color: delta > 0 ? '#2a7a3a' : theme.accent,
              fontWeight: 700,
            }}>{delta > 0 ? '+' : ''}{delta}</span>
          )}
        </span>
      </div>
      <div style={{
        height: 6, background: theme.ruleSoft,
        border: `0.5px solid ${theme.rule}`,
        position: 'relative', overflow: 'hidden',
      }}>
        <div style={{
          width: `${pct}%`, height: '100%',
          background: theme.ink,
          transition: 'width 0.9s cubic-bezier(0.2, 0.8, 0.2, 1)',
        }} />
        {/* Tick marks */}
        {[25, 50, 75].map(p => (
          <div key={p} style={{
            position: 'absolute', left: `${p}%`, top: 0, bottom: 0,
            width: 0.5, background: theme.paper, opacity: 0.8,
          }} />
        ))}
      </div>
    </div>
  );
}

// ─── Main Desk Screen ───
function DeskScreen({ theme, onThemeCycle }) {
  const [turnIdx, setTurnIdx] = useState(() => {
    const saved = Number(localStorage.getItem('nomenklatura_turn') || '0');
    return Math.max(0, Math.min(SCENARIOS.length - 1, saved));
  });
  const [phase, setPhase] = useState('briefing'); // briefing | outcome
  const [selectedOpt, setSelectedOpt] = useState(null);
  const [stats, setStats] = useState(() => {
    try {
      const s = JSON.parse(localStorage.getItem('nomenklatura_stats') || 'null');
      return s || INITIAL_STATS;
    } catch { return INITIAL_STATS; }
  });
  const [prevStats, setPrevStats] = useState(stats);
  const [hoveredChar, setHoveredChar] = useState(null);
  const [tabView, setTabView] = useState('briefing'); // briefing | actors | ledger
  const [swipeDX, setSwipeDX] = useState(0);
  const touchRef = useRef({ x: 0, active: false });

  useEffect(() => {
    localStorage.setItem('nomenklatura_turn', String(turnIdx));
  }, [turnIdx]);
  useEffect(() => {
    localStorage.setItem('nomenklatura_stats', JSON.stringify(stats));
  }, [stats]);

  const scenario = SCENARIOS[turnIdx];
  const fromCharacter = CHARACTERS[scenario.from];

  const selectOption = (opt) => {
    setPrevStats({ ...stats });
    const next = { ...stats };
    Object.entries(opt.effects).forEach(([k, v]) => {
      if (next[k] !== undefined) next[k] = Math.max(0, Math.min(100, next[k] + v));
    });
    setStats(next);
    setSelectedOpt(opt);
    setPhase('outcome');
  };

  const nextTurn = () => {
    const next = turnIdx + 1;
    if (next >= SCENARIOS.length) {
      setPhase('verdict');
      setTabView('briefing');
    } else {
      setTurnIdx(next);
      setPhase('briefing');
      setSelectedOpt(null);
      setTabView('briefing');
    }
  };

  const reset = () => {
    setTurnIdx(0);
    setPhase('briefing');
    setSelectedOpt(null);
    setStats(INITIAL_STATS);
    setPrevStats(INITIAL_STATS);
    setTabView('briefing');
    localStorage.removeItem('nomenklatura_turn');
    localStorage.removeItem('nomenklatura_stats');
  };

  // Swipe to advance (only in outcome phase)
  const onTouchStart = (e) => {
    touchRef.current = { x: e.touches[0].clientX, active: true };
  };
  const onTouchMove = (e) => {
    if (!touchRef.current.active) return;
    setSwipeDX(e.touches[0].clientX - touchRef.current.x);
  };
  const onTouchEnd = () => {
    if (swipeDX < -60 && phase === 'outcome') nextTurn();
    setSwipeDX(0);
    touchRef.current.active = false;
  };

  const delta = (k) => selectedOpt ? (stats[k] - prevStats[k]) : 0;

  return (
    <div
      style={{
        height: '100%', width: '100%',
        background: theme.bg,
        color: theme.ink,
        fontFamily: theme.body,
        position: 'relative',
        overflow: 'hidden',
        display: 'flex', flexDirection: 'column',
      }}
      onTouchStart={onTouchStart}
      onTouchMove={onTouchMove}
      onTouchEnd={onTouchEnd}
    >
      {/* Paper noise overlay */}
      {theme.paperNoise && <PaperTexture theme={theme} />}

      {/* Top bureau header (replaces iOS nav) */}
      <div style={{position:'relative', zIndex:2}}>
      <BureauHeader theme={theme} scenario={scenario} turnIdx={turnIdx} onReset={reset} />

      {/* Tab bar */}
      <TabBar theme={theme} active={tabView} onSelect={setTabView} />
      </div>

      {/* Body */}
      <div style={{
        flex: 1, overflowY: 'auto', overflowX: 'hidden',
        padding: '10px 14px 90px',
        position: 'relative', zIndex: 2,
        transform: phase === 'outcome' ? `translateX(${swipeDX * 0.4}px)` : 'none',
        transition: touchRef.current.active ? 'none' : 'transform 0.3s ease',
      }}>
        {tabView === 'briefing' && phase === 'briefing' && (
          <BriefingView
            theme={theme} scenario={scenario}
            fromCharacter={fromCharacter}
            onSelect={selectOption}
            onHover={setHoveredChar}
          />
        )}
        {tabView === 'briefing' && phase === 'outcome' && (
          <OutcomeView
            theme={theme} scenario={scenario}
            option={selectedOpt}
            stats={stats} delta={delta}
            onNext={nextTurn}
          />
        )}
        {tabView === 'briefing' && phase === 'verdict' && (
          <VerdictView
            theme={theme} stats={stats}
            onRestart={reset}
          />
        )}
        {tabView === 'actors' && (
          <ActorsView theme={theme} stats={stats} />
        )}
        {tabView === 'ledger' && (
          <LedgerView theme={theme} stats={stats} prevStats={prevStats} showDelta={phase === 'outcome'} />
        )}
      </div>

      {/* Hover dossier */}
      {hoveredChar && (
        <DossierCard
          character={hoveredChar}
          theme={theme}
          style={{ bottom: 80, left: 14, right: 14, width: 'auto' }}
        />
      )}

      {/* Bottom status strip with theme cycle */}
      <BottomStrip theme={theme} onThemeCycle={onThemeCycle} turnIdx={turnIdx} phase={phase} />
    </div>
  );
}

// ─── Verdict view — final judgement after all turns ───
function VerdictView({ theme, stats, onRestart }) {
  const [stage, setStage] = useState(0);
  useEffect(() => {
    const ts = [setTimeout(()=>setStage(1), 300), setTimeout(()=>setStage(2), 1000), setTimeout(()=>setStage(3), 1700)];
    return () => ts.forEach(clearTimeout);
  }, []);

  // Compute verdict
  const avg = Object.values(stats).reduce((a,b)=>a+b,0) / 5;
  const weakest = Object.entries(stats).reduce((w, [k,v]) => v < w.v ? {k, v} : w, {k: null, v: 101});
  const strongest = Object.entries(stats).reduce((w, [k,v]) => v > w.v ? {k, v} : w, {k: null, v: -1});

  let verdict, stamp, subtitle, epitaph;
  if (avg < 35 || stats.stability < 20) {
    verdict = 'THE REGIME FALLS';
    stamp = 'DISSOLVED';
    subtitle = 'Your file closes quietly. Petrenko opens hers.';
    epitaph = `The collapse begins with ${STAT_META[weakest.k].label.toLowerCase()}. It ends in a corridor you will not see.`;
  } else if (avg > 70) {
    verdict = 'THE APPARATUS ENDURES';
    stamp = 'COMMENDED';
    subtitle = 'The Chairman reads your summary twice. He keeps the second copy.';
    epitaph = `${STAT_META[strongest.k].label} climbed. The Politburo took note. You remain, for now, the quiet center of the machine.`;
  } else {
    verdict = 'THE FILE IS CLOSED';
    stamp = 'ARCHIVED';
    subtitle = 'History does not call your name. It does not need to.';
    epitaph = `Three directives. Some held. Some cost you. The Party survives, which is the only verdict that matters.`;
  }

  const verdictColor = avg > 70 ? '#2a7a3a' : (avg < 35 ? theme.accent : theme.ink);

  return (
    <div style={{ paddingTop: 8 }}>
      {/* The final file */}
      <div style={{
        background: theme.paper,
        border: `1px solid ${theme.rule}`,
        borderRadius: theme.cardRadius,
        padding: '20px 18px',
        position: 'relative',
        minHeight: 320,
      }}>
        {/* Final stamp */}
        <div style={{
          position: 'absolute', top: 14, right: 10,
          opacity: stage >= 1 ? 1 : 0,
          transform: stage >= 1 ? 'scale(1) rotate(-6deg)' : 'scale(2) rotate(-40deg)',
          transition: 'all 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.3)',
          pointerEvents: 'none',
        }}>
          <Stamp text={stamp} color={verdictColor} rotate={0} size={1.15} />
        </div>

        <div style={{
          fontFamily: theme.mono, fontSize: 9, letterSpacing: 2.5,
          color: theme.inkFaint, textTransform: 'uppercase', marginBottom: 10,
        }}>FINAL DISPOSITION · PSRA 1952</div>

        <div style={{
          fontFamily: theme.display,
          fontSize: theme.key === 'red' ? 24 : 22,
          fontWeight: theme.key === 'red' ? 700 : 700,
          lineHeight: 1.05, color: verdictColor,
          textTransform: 'uppercase',
          letterSpacing: theme.key === 'red' ? 0.5 : 0.2,
          marginBottom: 10,
          maxWidth: '72%',
          opacity: stage >= 2 ? 1 : 0,
          transform: stage >= 2 ? 'translateY(0)' : 'translateY(6px)',
          transition: 'all 0.5s ease',
        }}>{verdict}</div>

        <div style={{
          fontFamily: theme.carbonCopy ? theme.mono : theme.body,
          fontSize: 13, lineHeight: 1.5,
          color: theme.inkSoft, fontStyle: theme.carbonCopy ? 'normal' : 'italic',
          marginBottom: 14, textWrap: 'pretty',
          opacity: stage >= 2 ? 1 : 0, transition: 'opacity 0.6s ease 0.1s',
        }}>{subtitle}</div>

        <div style={{
          fontSize: 13, lineHeight: 1.55,
          color: theme.ink, textWrap: 'pretty',
          fontFamily: theme.carbonCopy ? theme.mono : theme.body,
          opacity: stage >= 3 ? 1 : 0,
          transform: stage >= 3 ? 'translateY(0)' : 'translateY(6px)',
          transition: 'all 0.5s ease',
          paddingTop: 12, marginTop: 4,
          borderTop: `0.5px solid ${theme.rule}`,
        }}>{epitaph}</div>
      </div>

      {/* Final ledger */}
      <div style={{
        marginTop: 14,
        background: theme.paper,
        border: `1px solid ${theme.rule}`,
        borderRadius: theme.cardRadius,
        padding: '12px 14px',
        opacity: stage >= 3 ? 1 : 0,
        transform: stage >= 3 ? 'translateY(0)' : 'translateY(10px)',
        transition: 'all 0.6s ease 0.2s',
      }}>
        <div style={{
          fontFamily: theme.mono, fontSize: 9, letterSpacing: 2,
          color: theme.inkFaint, textTransform: 'uppercase', marginBottom: 10,
        }}>STATE LEDGER · FINAL</div>
        {Object.entries(STAT_META).map(([k, m]) => (
          <StatMeter
            key={k}
            label={m.label} icon={m.icon}
            value={stats[k]} delta={0}
            theme={theme} showDelta={false}
          />
        ))}
      </div>

      {/* Restart */}
      <button onClick={onRestart} style={{
        marginTop: 18, width: '100%',
        background: 'transparent',
        color: theme.ink,
        border: `1px solid ${theme.rule}`,
        borderRadius: theme.cardRadius,
        padding: '14px',
        fontFamily: theme.mono,
        fontSize: 11,
        letterSpacing: 3,
        textTransform: 'uppercase',
        fontWeight: 700,
        cursor: 'pointer',
        opacity: stage >= 3 ? 1 : 0,
        transition: 'opacity 0.5s ease 0.4s',
      }}>
        ← Begin New File
      </button>
    </div>
  );
}

<script type="text/babel">
// use-game.js — shared game state hook for all three screen variants.
// Provides: scenario, stats, phase, selectOption, nextTurn, reset.

const { useState, useEffect: _ue, useRef: _ur } = React;

function useGame() {
  const [turnIdx, setTurnIdx] = useState(() => {
    const v = Number(localStorage.getItem('apparatus.turn') || 0);
    return Math.min(Math.max(0, v), SCENARIOS.length - 1);
  });
  const [phase, setPhase] = useState('briefing'); // briefing | outcome | verdict
  const [stats, setStats] = useState(() => {
    try {
      const s = JSON.parse(localStorage.getItem('apparatus.stats') || 'null');
      return s && typeof s === 'object' ? s : { ...INITIAL_STATS };
    } catch { return { ...INITIAL_STATS }; }
  });
  const [prevStats, setPrevStats] = useState({ ...stats });
  const [selectedOpt, setSelectedOpt] = useState(null);
  const [hoveredChar, setHoveredChar] = useState(null);

  _ue(() => { localStorage.setItem('apparatus.turn', String(turnIdx)); }, [turnIdx]);
  _ue(() => { localStorage.setItem('apparatus.stats', JSON.stringify(stats)); }, [stats]);

  const scenario = SCENARIOS[turnIdx];
  const fromCharacter = CHARACTERS[scenario.from];

  function selectOption(opt) {
    if (phase !== 'briefing') return;
    setPrevStats({ ...stats });
    setStats(s => {
      const next = { ...s };
      for (const k of Object.keys(opt.effects)) {
        next[k] = Math.max(0, Math.min(100, (s[k] || 0) + opt.effects[k]));
      }
      return next;
    });
    setSelectedOpt(opt);
    setPhase('outcome');
  }

  function nextTurn() {
    if (turnIdx + 1 >= SCENARIOS.length) {
      setPhase('verdict');
      return;
    }
    setTurnIdx(i => i + 1);
    setSelectedOpt(null);
    setPhase('briefing');
  }

  function reset() {
    setStats({ ...INITIAL_STATS });
    setPrevStats({ ...INITIAL_STATS });
    setTurnIdx(0);
    setSelectedOpt(null);
    setPhase('briefing');
  }

  const delta = (k) => selectedOpt ? (stats[k] - prevStats[k]) : 0;

  return {
    turnIdx, phase, stats, prevStats, selectedOpt, hoveredChar,
    scenario, fromCharacter,
    setHoveredChar, selectOption, nextTurn, reset, delta,
  };
}

Object.assign(window, { useGame });

</script>

<script type="text/babel">
const { useState, useEffect } = React;

// Tweakable defaults — persistable via Tweaks mode
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "themeKey": "red",
  "density": "regular",
  "textureAmount": 1,
  "accentOverride": "red",
  "fontPairing": "modern"
}/*EDITMODE-END*/;

// Wait for all sibling babel scripts to finish before mounting
function waitForGlobals(names, cb) {
  if (names.every(n => window[n])) return cb();
  setTimeout(() => waitForGlobals(names, cb), 30);
}

// Accent overrides
const ACCENT_CHOICES = {
  '': null,
  'oxblood': '#8b1818',
  'red': '#cc1a1a',
  'crimson': '#c72828',
  'gold': '#b08830',
  'muted': '#6a4a32',
};

// Font pairing overrides (applied per theme)
const FONT_PAIRINGS = {
  default: null,
  condensed: {
    parchment: { display: '"Playfair Display", Georgia, serif', body: '"Source Serif 4", Georgia, serif' },
    red: { display: '"Bebas Neue", "Arial Black", sans-serif', body: '"Work Sans", sans-serif' },
    redacted: { display: '"Special Elite", ui-monospace', body: '"Courier Prime", ui-monospace' },
  },
  modern: {
    parchment: { display: '"Work Sans", sans-serif', body: '"Work Sans", sans-serif' },
    red: { display: '"Oswald", sans-serif', body: '"JetBrains Mono", monospace' },
    redacted: { display: '"JetBrains Mono", monospace', body: '"JetBrains Mono", monospace' },
  },
};

function App() {
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [tweakMode, setTweakMode] = useState(false);
  const [sideTheme, setSideTheme] = useState(null); // for multi-view comparison

  // Tweak protocol
  useEffect(() => {
    const onMsg = (e) => {
      if (!e.data || !e.data.type) return;
      if (e.data.type === '__activate_edit_mode') setTweakMode(true);
      if (e.data.type === '__deactivate_edit_mode') setTweakMode(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const setKey = (key, val) => {
    setTweaks(prev => ({ ...prev, [key]: val }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
  };

  // Build active theme from tweaks
  const buildTheme = (themeKey) => {
    const base = { ...THEMES[themeKey] };
    if (tweaks.accentOverride && ACCENT_CHOICES[tweaks.accentOverride]) {
      base.accent = ACCENT_CHOICES[tweaks.accentOverride];
      base.star = ACCENT_CHOICES[tweaks.accentOverride];
    }
    if (tweaks.fontPairing !== 'default' && FONT_PAIRINGS[tweaks.fontPairing]) {
      const fp = FONT_PAIRINGS[tweaks.fontPairing][themeKey];
      if (fp) {
        base.display = fp.display;
        base.body = fp.body;
      }
    }
    if (tweaks.textureAmount === 0) base.paperNoise = false;
    return base;
  };

  const activeTheme = buildTheme(tweaks.themeKey);

  const cycleTheme = () => {
    const order = ['parchment', 'red', 'redacted'];
    const idx = order.indexOf(tweaks.themeKey);
    setKey('themeKey', order[(idx + 1) % order.length]);
  };

  return (
    <>
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 14 }}>
        <div style={{
          textAlign: 'center',
          fontFamily: '"Oswald", sans-serif',
          color: '#d4c8a8',
          fontSize: 11, letterSpacing: 4,
          textTransform: 'uppercase',
          opacity: 0.5,
        }}>
          <div style={{ fontSize: 18, letterSpacing: 6, marginBottom: 4, color: '#c72828' }}>★ NOMENKLATURA</div>
          Desk · iPhone 15 Pro · PSRA 1952
        </div>
        <IOSDevice dark={activeTheme.statusDark}>
          {tweaks.themeKey === 'parchment' && <DossierScreen onThemeCycle={cycleTheme} />}
          {tweaks.themeKey === 'red' && <DeskScreen theme={activeTheme} onThemeCycle={cycleTheme} />}
          {tweaks.themeKey === 'redacted' && <RedactedScreen onThemeCycle={cycleTheme} />}
        </IOSDevice>
        <div style={{
          display: 'flex', gap: 10,
          fontFamily: '"JetBrains Mono", monospace',
          fontSize: 10, letterSpacing: 1.5, textTransform: 'uppercase',
        }}>
          {['parchment', 'red', 'redacted'].map(k => (
            <button key={k} onClick={() => setKey('themeKey', k)} style={{
              background: tweaks.themeKey === k ? THEMES[k].accent : 'transparent',
              border: `1px solid ${tweaks.themeKey === k ? THEMES[k].accent : 'rgba(212,200,168,0.25)'}`,
              color: tweaks.themeKey === k ? '#fff' : '#9a8e70',
              padding: '6px 12px',
              cursor: 'pointer',
              letterSpacing: 2,
              fontFamily: 'inherit', fontSize: 9,
            }}>{THEMES[k].name}</button>
          ))}
        </div>
      </div>

      {tweakMode && (
        <TweaksPanel
          tweaks={tweaks}
          setKey={setKey}
        />
      )}
    </>
  );
}

function TweaksPanel({ tweaks, setKey }) {
  return (
    <div style={{
      position: 'fixed', bottom: 20, right: 20, width: 280,
      background: '#15130e',
      border: '1px solid rgba(212,200,168,0.25)',
      borderLeft: '3px solid #c72828',
      padding: 16,
      fontFamily: '"JetBrains Mono", monospace',
      color: '#d4c8a8', fontSize: 11,
      zIndex: 1000,
      boxShadow: '0 12px 40px rgba(0,0,0,0.6)',
    }}>
      <div style={{
        fontSize: 10, letterSpacing: 3, color: '#c72828',
        textTransform: 'uppercase', fontWeight: 700, marginBottom: 12,
        paddingBottom: 8, borderBottom: '1px solid rgba(212,200,168,0.15)',
      }}>
        ★ TWEAKS — APPARATUS
      </div>

      <TweakRow label="Theme">
        <Select value={tweaks.themeKey} onChange={v => setKey('themeKey', v)} options={[
          ['parchment', 'Parchment'],
          ['red', 'Red Apparatus'],
          ['redacted', 'Redacted'],
        ]} />
      </TweakRow>

      <TweakRow label="Accent">
        <Select value={tweaks.accentOverride} onChange={v => setKey('accentOverride', v)} options={[
          ['', 'Theme default'],
          ['oxblood', 'Oxblood'],
          ['red', 'Soviet red'],
          ['crimson', 'Crimson'],
          ['gold', 'Gold'],
          ['muted', 'Muted earth'],
        ]} />
      </TweakRow>

      <TweakRow label="Typeface">
        <Select value={tweaks.fontPairing} onChange={v => setKey('fontPairing', v)} options={[
          ['default', 'Theme default'],
          ['condensed', 'Condensed'],
          ['modern', 'Modern sans/mono'],
        ]} />
      </TweakRow>

      <TweakRow label="Texture">
        <Select value={String(tweaks.textureAmount)} onChange={v => setKey('textureAmount', Number(v))} options={[
          ['0', 'Clean'],
          ['1', 'Aged'],
        ]} />
      </TweakRow>

      <div style={{
        marginTop: 12, paddingTop: 10,
        borderTop: '1px solid rgba(212,200,168,0.1)',
        fontSize: 9, letterSpacing: 1, color: '#6a5e48',
        fontStyle: 'italic',
      }}>
        Changes persist on reload.
      </div>
    </div>
  );
}

function TweakRow({ label, children }) {
  return (
    <div style={{ marginBottom: 10 }}>
      <div style={{
        fontSize: 9, letterSpacing: 1.5, color: '#9a8e70',
        textTransform: 'uppercase', marginBottom: 4,
      }}>{label}</div>
      {children}
    </div>
  );
}

function Select({ value, onChange, options }) {
  return (
    <select value={value} onChange={e => onChange(e.target.value)} style={{
      width: '100%',
      background: '#0a0907',
      border: '1px solid rgba(212,200,168,0.2)',
      color: '#d4c8a8',
      padding: '6px 8px',
      fontFamily: 'inherit', fontSize: 11,
      cursor: 'pointer',
    }}>
      {options.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
    </select>
  );
}

waitForGlobals(['THEMES', 'SCENARIOS', 'CHARACTERS', 'INITIAL_STATS', 'STAT_META', 'DeskScreen', 'DossierScreen', 'RedactedScreen', 'useGame', 'IOSDevice'], () => {
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
});
</script>
</body>
</html>
